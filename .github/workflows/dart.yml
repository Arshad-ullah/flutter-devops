name: flutter-project
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: setup-flutter
        uses: subosito/flutter-action@v2.14.0
        with:
          channel: stable

      - name: get dependency
        run: flutter pub get

      - name: flutter-apk
        run: flutter build apk --release
        

      
   

    
