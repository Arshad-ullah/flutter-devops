name: flutter-project

on:
  push:
    branches:
      - main

jobs:
  flutter:
    runs-on: ubuntu-latest

    steps:
      - name: checkout-code
        uses: actions/checkout@v7

      - name: setup-flutter
        uses: subosito/flutter-action@v2.14.0
        with:
          channel: stable

      - name: get dependency
        run: flutter pub get

      - name: flutter-test
        run: flutter test

      - name: flutter-apk
        run: flutter build apk --release

      - name: Capture Flutter/Dart Info
        run: |
          FLUTTER_VERSION=$(flutter --version | head -n 1)
          DART_VERSION=$(dart --version 2>&1)

          echo "FLUTTER_VERSION=$FLUTTER_VERSION" >> $GITHUB_ENV
          echo "DART_VERSION=$DART_VERSION" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          DATE_TIME=$(date +"%d-%m-%Y_%H-%M-%S")
          APK_NAME="${DATE_TIME}.apk"

          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/$APK_NAME

          APK_PATH="build/app/outputs/flutter-apk/$APK_NAME"
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)

          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date '+%d-%m-%Y %H:%M:%S')" >> $GITHUB_ENV

      - name: Get Commit Info
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)

          echo "COMMIT_MSG=$COMMIT_MSG" >> $GITHUB_ENV
          echo "COMMIT_AUTHOR=$COMMIT_AUTHOR" >> $GITHUB_ENV

      - name: Create Build Info
        run: |
          cat > build-info.txt <<EOF
          Flutter APK Build Information
          ==============================

          Repository        : ${{ github.repository }}
          Repository URL     : ${{ github.server_url }}/${{ github.repository }}

          Branch             : ${{ github.ref_name }}
          Commit              : ${{ github.sha }}
          Commit URL         : ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          Commit Message      : ${{ env.COMMIT_MSG }}
          Commit Author        : ${{ env.COMMIT_AUTHOR }}

          Workflow            : ${{ github.workflow }}
          Workflow Run #        : ${{ github.run_number }}
          Workflow Run URL      : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Triggered By          : ${{ github.actor }}

          Flutter Version      : ${{ env.FLUTTER_VERSION }}
          Dart Version         : ${{ env.DART_VERSION }}

          APK Name             : ${{ env.APK_NAME }}
          APK Size              : ${{ env.APK_SIZE }}
          Build Date            : ${{ env.BUILD_DATE }}

          ==============================
          Build completed successfully.
          EOF

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Send mail
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}

          subject: "Flutter APK Build Successful - ${{ github.repository }} (${{ env.APK_NAME }})"

          to: arshadullah.icp@gmail.com

          from: GitHub Actions <jahan665577@gmail.com>

          body: |
            Hello,

            Flutter APK build completed successfully.

            Repository       : ${{ github.repository }}
            Branch           : ${{ github.ref_name }}
            Commit Message   : ${{ env.COMMIT_MSG }}
            Commit Author    : ${{ env.COMMIT_AUTHOR }}

            Flutter Version  : ${{ env.FLUTTER_VERSION }}
            Dart Version     : ${{ env.DART_VERSION }}

            APK Name         : ${{ env.APK_NAME }}
            APK Size         : ${{ env.APK_SIZE }}
            Build Date       : ${{ env.BUILD_DATE }}

            Download / Workflow:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The APK and build information are attached to this email.

          attachments: |

            build-info.txt
